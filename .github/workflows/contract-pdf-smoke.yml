name: Smoke test SINTONE PDF generation

on:
  push:
    branches:
      - feature/onboarding-contract-acceptance
    paths:
      - .github/workflows/contract-pdf-smoke.yml
      - scripts/contract-pdf-smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Convert HTML including signature footer to PDF in Chromium
        run: python scripts/contract-pdf-smoke.py
