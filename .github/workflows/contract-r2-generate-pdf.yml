name: Generate SINTONE contract review PDF

on:
  push:
    branches: [feature/sintone-contract-revision-2026]
    paths:
      - scripts/generate_contract_review_pdf.py
      - docs/contratos/sintone-contrato-2026-11-r2.txt
      - .github/workflows/contract-r2-generate-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/sintone-contract-revision-2026
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PDF generator
        run: python -m pip install 'reportlab==4.4.4' 'pymupdf==1.26.6'
      - name: Generate complete draft PDF
        run: python scripts/generate_contract_review_pdf.py
      - name: Commit full-text PDF (no secrets)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/contratos/CONTRATO_SINTONE_2026-11_R2_MINUTA.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Add complete SINTONE R2 contract PDF for review'
            git push origin HEAD:feature/sintone-contract-revision-2026
          fi
