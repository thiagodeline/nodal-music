name: Validate full SINTONE legal contract PDF

on:
  push:
    branches: [feature/sintone-contract-revision-2026]
    paths:
      - docs/contratos/sintone-contrato-2026-11-r2.txt
      - scripts/test-full-contract-pdf.py
      - .github/workflows/contract-r2-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install node/python dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Test generation of all PDF pages and footer
        run: python scripts/test-full-contract-pdf.py
      - name: Test Next.js production build
        run: npm run build
