name: Test SINTONE onboarding and contract redirects

on:
  push:
    branches: [fix/onboarding-contract-redirect]
    paths:
      - src/middleware.ts
      - src/lib/onboarding-route.ts
      - src/app/onboarding/**
      - src/components/dashboard/**
      - scripts/test-onboarding-route.cjs
      - .github/workflows/onboarding-redirect-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate onboarding redirect matrix
        run: node scripts/test-onboarding-route.cjs
      - name: Verify Next.js production build
        run: npm run build
