name: Test register checkbox click and overlay

on:
  push:
    branches:
      - diagnostic/register-checkbox-live
    paths:
      - .github/workflows/register-checkbox-diagnostic.yml
      - scripts/check_register_live.py
      - src/app/register/register.css
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-placeholder
      REGISTER_TEST_URL: http://127.0.0.1:3000/register
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install application and browser
        run: |
          npm ci --no-audit --no-fund
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start Next.js and wait for readiness
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/sintone-next.log 2>&1 &
          echo $! >/tmp/sintone-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/register >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sintone-next.log
          exit 1
      - name: Verify checkbox on desktop and mobile
        run: python scripts/check_register_live.py
      - name: Show Next.js logs on failure
        if: failure()
        run: cat /tmp/sintone-next.log
