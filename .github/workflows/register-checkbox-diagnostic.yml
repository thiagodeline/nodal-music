name: Diagnose register checkbox on production

on:
  push:
    branches:
      - diagnostic/register-checkbox-live
    paths:
      - .github/workflows/register-checkbox-diagnostic.yml
      - scripts/check_register_live.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Playwright and browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test live checkbox interaction
        run: python scripts/check_register_live.py
