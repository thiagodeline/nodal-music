name: SINTONE live registration smoke check

on:
  push:
    branches: [qa/signup-live-sintone]
    paths: [.github/workflows/signup-live-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      REGISTER_TEST_URL: https://sintone.vercel.app/register
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify live signup/login URLs without creating accounts
        run: python scripts/signup-production-diagnostic.py
