name: Validate Supabase connection in Next.js without registering users

on:
  push:
    branches:
      - fix/signup-supabase-production
    paths:
      - src/lib/supabase/**
      - src/middleware.ts
      - src/app/register/page.tsx
      - scripts/signup-production-diagnostic.py
      - .github/workflows/signup-production-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install application and browser
        run: |
          npm install --no-audit --no-fund
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local Next.js with no Supabase Vercel env variables
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/sintone-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/register >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sintone-next.log
          exit 1
      - name: Verify signup, auth endpoint and login
        env:
          REGISTER_TEST_URL: http://127.0.0.1:3000/register
        run: python scripts/signup-production-diagnostic.py
      - name: Validate production compilation
        run: npm run build
      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/sintone-next.log || true
