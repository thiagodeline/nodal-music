name: Diagnose live Supabase signup without creating users

on:
  push:
    branches: [fix/signup-supabase-production]
    paths:
      - scripts/signup-production-diagnostic.py
      - .github/workflows/signup-production-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Diagnose registration without sending a signup request
        run: python scripts/signup-production-diagnostic.py
